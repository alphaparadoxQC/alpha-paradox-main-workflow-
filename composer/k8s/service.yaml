apiVersion: v1
kind: Service
metadata:
  name: alpha-api-service
spec:
  selector:
    app: alpha-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-redis
spec:
  selector:
    app: alpha-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
